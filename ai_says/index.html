<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All AI Picks</title>
    <style>
        /* General Body Styling */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 2rem;
            background: #f8f9fa;
            color: #333;
        }
        h1 {
            font-size: 2.2rem;
            color: #212529;
            margin-bottom: 0.5rem;
        }
        p {
            font-size: 1.1rem;
            color: #555;
            margin-bottom: 1.5rem;
        }

        /* Navigation Links Container */
        .nav-links-container {
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            margin-top: 2rem;
            padding: 1.5rem; /* Add padding around the links */
        }

        /* Navigation Links (formerly tab-headers) */
        .nav-links {
            display: flex;
            flex-wrap: wrap; /* Allows links to wrap on smaller screens */
            gap: 10px; /* Space between links */
            justify-content: center; /* Center the links */
        }

        .nav-link-button {
            display: inline-block; /* Make anchors behave like block for padding */
            background-color: #e9ecef;
            text-decoration: none; /* Remove underline */
            color: #495057;
            padding: 0.8rem 1.2rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 5px; /* Slightly rounded corners for buttons */
            transition: background-color 0.3s ease, color 0.3s ease;
            text-align: center;
            white-space: nowrap; /* Prevent text wrapping within a button */
        }

        .nav-link-button:hover {
            background-color: #d8dee3;
            color: #212529;
        }

        /* Loading and Error States */
        #loading-message, #error-message {
            text-align: center;
            padding: 1rem;
            color: #6c757d;
            width: 100%; /* Ensure these span the full width */
        }

        /* Back to Home Link */
        .back-link {
            display: block;
            margin-top: 2rem;
            text-align: center;
            font-size: 1.1rem;
            color: #0d6efd;
            text-decoration: none;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>📊 AI picks</h1>
    <p>Latest reports with visual insights.</p>

    <div class="nav-links-container">
        <div class="nav-links" id="nav-links">
            <span id="loading-message">Loading reports...</span>
            <span id="error-message" style="display: none;">Failed to load reports.</span>
        </div>
    </div>

    <p><a href="/" class="back-link">← Back to Home</a></p>

    <script>
        const navLinksContainer = document.getElementById('nav-links');
        const loadingMessage = document.getElementById('loading-message');
        const errorMessage = document.getElementById('error-message');

        fetch('../indices/stocks_index.json')
            .then(res => {
                if (!res.ok) {
                    throw new Error(`HTTP error! status: ${res.status}`);
                }
                return res.json();
            })
            .then(data => {
                loadingMessage.style.display = 'none'; // Hide loading message

                if (data.length === 0) {
                    navLinksContainer.innerHTML = '<span style="padding: 1rem; text-align: center; display: block; width: 100%;">No reports found.</span>';
                    return;
                }

                data.forEach(filename => {
                    const cleanName = filename.replace(/\.html$/, '').replace(/_/g, ' ');

                    // Create an anchor tag acting as a button
                    const linkButton = document.createElement('a');
                    linkButton.className = 'nav-link-button';
                    linkButton.href = filename; // Direct link to the report HTML
                    linkButton.textContent = cleanName;
                    navLinksContainer.appendChild(linkButton);
                });
            })
            .catch(err => {
                loadingMessage.style.display = 'none';
                errorMessage.style.display = 'block';
                console.error('Error fetching stocks_index.json:', err);
            });
    </script>
</body>
</html>
